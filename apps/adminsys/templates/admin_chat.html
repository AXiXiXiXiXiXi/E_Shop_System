<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>售后聊天管理</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-list {
            max-height: 400px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
        }
        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover {
            background: #f8f9fa;
        }
        .chat-item.active {
            background: #e3f2fd;
        }
        .chat-item h4 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .chat-item p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .chat-detail {
            display: none;
            padding: 20px;
        }
        .chat-detail.active {
            display: block;
        }
        .messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 70%;
        }
        .user-message {
            background: #007bff;
            color: white;
            margin-left: auto;
        }
        .admin-message {
            background: #e9ecef;
            color: #333;
        }
        .reply-form {
            display: flex;
            gap: 10px;
        }
        .reply-form textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            min-height: 60px;
        }
        .reply-form button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .reply-form button:hover {
            background: #218838;
        }
        .complete-btn {
            background: #dc3545;
            margin-top: 10px;
        }
        .complete-btn:hover {
            background: #c82333;
        }
        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-processing { background: #cce5ff; color: #0056b3; }
        .status-completed { background: #d1ecf1; color: #0c5460; }
        .unread-badge {
            background: #dc3545;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>售后聊天管理</h1>
            <p>管理员客服回复界面</p>
        </div>
        
        <div class="chat-list" id="chatList">
            <div class="loading">加载中...</div>
        </div>
        
        <div class="chat-detail" id="chatDetail">
            <h3 id="chatTitle">选择一个对话</h3>
            <div class="messages" id="messages"></div>
            <div class="reply-form">
                <textarea id="replyMessage" placeholder="输入回复内容..."></textarea>
                <button onclick="sendReply()">发送回复</button>
            </div>
            <button class="reply-form button complete-btn" onclick="markComplete()">标记完成</button>
        </div>
    </div>

    <script>
        let currentChatId = null;
        let chatList = [];

        // 获取管理员Token（这里需要根据实际情况获取）
        const adminToken = prompt('请输入管理员Token:');
        if (!adminToken) {
            alert('需要管理员Token才能访问');
            window.location.href = '/admin/';
        }

        async function loadChatList() {
            try {
                const response = await fetch('/api/adminsys/after-sale-chat/', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    chatList = result.data;
                    renderChatList();
                } else {
                    alert('加载失败: ' + result.error);
                }
            } catch (error) {
                console.error('加载聊天列表失败:', error);
                alert('加载失败，请检查网络连接');
            }
        }

        function renderChatList() {
            const listEl = document.getElementById('chatList');
            if (chatList.length === 0) {
                listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">暂无聊天记录</div>';
                return;
            }

            listEl.innerHTML = chatList.map(chat => `
                <div class="chat-item" onclick="selectChat(${chat.id})">
                    <h4>
                        ${chat.user.username} - AS${chat.id.toString().padStart(6, '0')}
                        <span class="status-badge status-${chat.status}">${getStatusText(chat.status)}</span>
                        ${chat.unread_count > 0 ? `<span class="unread-badge">${chat.unread_count}</span>` : ''}
                    </h4>
                    <p>${chat.order_item_details.product_name}</p>
                    <p style="font-size: 12px; color: #999;">
                        ${chat.latest_message ? chat.latest_message.message.substring(0, 50) + '...' : '暂无消息'}
                    </p>
                </div>
            `).join('');
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': '待处理',
                'processing': '处理中',
                'approved': '已批准',
                'rejected': '已拒绝',
                'completed': '已完成'
            };
            return statusMap[status] || status;
        }

        async function selectChat(chatId) {
            currentChatId = chatId;
            const chat = chatList.find(c => c.id === chatId);
            
            // 更新UI
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.chat-item').classList.add('active');
            
            document.getElementById('chatTitle').textContent = 
                `${chat.user.username} - ${chat.order_item_details.product_name}`;
            document.getElementById('chatDetail').classList.add('active');

            // 加载消息
            await loadMessages(chatId);
        }

        async function loadMessages(chatId) {
            try {
                const response = await fetch(`/api/adminsys/after-sale-chat/${chatId}/messages/`, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    renderMessages(result.data);
                }
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        function renderMessages(messages) {
            const messagesEl = document.getElementById('messages');
            messagesEl.innerHTML = messages.map(msg => `
                <div class="message ${msg.sender_type === 'user' ? 'user-message' : 'admin-message'}">
                    <strong>${msg.sender_name}:</strong> ${msg.message}
                    <div style="font-size: 11px; margin-top: 5px; opacity: 0.7;">
                        ${new Date(msg.created_at).toLocaleString()}
                    </div>
                </div>
            `).join('');
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendReply() {
            const messageContent = document.getElementById('replyMessage').value.trim();
            if (!messageContent || !currentChatId) return;

            try {
                const response = await fetch('/api/adminsys/after-sale-chat/reply/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        after_sale_request_id: currentChatId,
                        message: messageContent
                    })
                });

                const result = await response.json();
                if (result.success) {
                    document.getElementById('replyMessage').value = '';
                    await loadMessages(currentChatId);
                    await loadChatList(); // 刷新列表
                } else {
                    alert('发送失败: ' + result.error);
                }
            } catch (error) {
                console.error('发送回复失败:', error);
                alert('发送失败，请重试');
            }
        }

        async function markComplete() {
            if (!currentChatId) return;
            if (!confirm('确定要标记此售后申请为完成吗？完成后将无法继续聊天。')) return;

            try {
                const response = await fetch(`/api/adminsys/after-sale-chat/${currentChatId}/complete/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();
                if (result.success) {
                    alert('已标记为完成');
                    await loadChatList();
                    document.getElementById('chatDetail').classList.remove('active');
                } else {
                    alert('操作失败: ' + result.error);
                }
            } catch (error) {
                console.error('标记完成失败:', error);
                alert('操作失败，请重试');
            }
        }

        // 页面加载时获取聊天列表
        loadChatList();
        
        // 每30秒自动刷新
        setInterval(loadChatList, 30000);
    </script>
</body>
</html>
