{% extends 'lostfound/base.html' %}

{% block title %}删除公告 - 校园失物招领系统{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 class="text-center" style="margin-bottom: 2rem; color: #dc3545;">⚠️ 确认删除</h2>
    
    <div style="background: #f8d7da; border: 1px solid #f5c6cb; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
        <p style="margin: 0; color: #721c24; line-height: 1.6;">
            您确定要删除公告 <strong>"{{ notice.title }}"</strong> 吗？此操作不可撤销！
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-secondary" style="flex: 1; background: #dc3545;">确认删除</button>
            <a href="{% url 'notice_detail' notice.pk %}" class="btn btn-primary" style="flex: 1; text-align: center; line-height: 2.5;">取消</a>
        </div>
    </form>
</div>
{% endblock %}
